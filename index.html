    <script>
      const isInStandaloneMode = () =>
      (window.matchMedia('(display-mode: standalone)').matches) || (window.navigator.standalone);

      if (isInStandaloneMode()) {
        document.querySelector('body').classList.add('standalone')
      }
    </script>
